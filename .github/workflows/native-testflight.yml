name: Native TestFlight
run-name: TestFlight ${{ inputs.release_version }} (${{ inputs.build_number }})
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (CFBundleShortVersionString), for example 1.0.1
        required: true
        default: "1.0.1"
        type: string
      build_number:
        description: New unused build number (CFBundleVersion), for example 2 or 42.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IOS_MARKETING_VERSION: ${{ inputs.release_version }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Validate version inputs
        run: |
          [[ "$IOS_MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release version must use major.minor.patch format.' >&2
            exit 1
          }
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]] || {
            echo 'Build number must contain one to three period-separated integers.' >&2
            exit 1
          }
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release prerequisites
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64 ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          test "$major" -ge 26 || { echo 'App Store Connect requires Xcode 26 or newer.'; exit 1; }
      - run: chmod +x gradlew
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - name: Verify shared code and SwiftUI build on release toolchain
        run: |
          if [ "$(uname -m)" = arm64 ]; then ./gradlew :shared:iosSimulatorArm64Test; else ./gradlew :shared:iosX64Test; fi
          xcodebuild build -project iosApp/FendYourSpend.xcodeproj -scheme FendYourSpend -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$IOS_MARKETING_VERSION" CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER"
      - name: Sign, archive and upload Fend Your Spend
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash tools/upload-testflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-release-results
          retention-days: 7
          path: |
            native/iosApp/ReleaseTests.xcresult
            native/iosApp/build/export/*.ipa
