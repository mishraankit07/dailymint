name: Native TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release prerequisites
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64 ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          test "$major" -ge 26 || { echo 'App Store Connect requires Xcode 26 or newer.'; exit 1; }
      - run: chmod +x gradlew
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - name: Verify shared code and SwiftUI build on release toolchain
        run: |
          if [ "$(uname -m)" = arm64 ]; then ./gradlew :shared:iosSimulatorArm64Test; else ./gradlew :shared:iosX64Test; fi
          xcodebuild build -project iosApp/DailyMint.xcodeproj -scheme DailyMint -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
      - name: Sign, archive and upload DailyMint
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash tools/upload-testflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-release-results
          retention-days: 7
          path: |
            native/iosApp/ReleaseTests.xcresult
            native/iosApp/build/export/*.ipa
