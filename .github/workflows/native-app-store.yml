name: Native App Store Candidate
on:
  workflow_dispatch:
    inputs:
      tested_build:
        description: Approved TestFlight build number, for example 34.1
        required: true
        type: string
      release_version:
        description: App Store version in major.minor.patch format
        required: true
        default: 1.0.0
        type: string
      production_build:
        description: Unused production build number, for example 1
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-app-store-candidate
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - name: Resolve the tested TestFlight source
        id: tested_source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_BUILD: ${{ inputs.tested_build }}
        run: |
          [[ "$TESTED_BUILD" =~ ^[1-9][0-9]*\.[1-9][0-9]*$ ]] || {
            echo 'tested_build must use the TestFlight workflow format, such as 34.1.' >&2
            exit 1
          }
          run_number="${TESTED_BUILD%%.*}"
          run_attempt="${TESTED_BUILD##*.}"
          run_json=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow native-testflight.yml \
            --limit 1000 --json number,attempt,conclusion,headSha \
            --jq ".[] | select(.number == $run_number and .attempt == $run_attempt and .conclusion == \"success\")")
          test -n "$run_json" || {
            echo "No successful Native TestFlight run produced build $TESTED_BUILD." >&2
            exit 1
          }
          source_sha=$(jq -r '.headSha' <<<"$run_json")
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved TestFlight build $TESTED_BUILD to $source_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested_source.outputs.sha }}
      - name: Check out current release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify App Store build validation
        run: python3 ../release-tools/native/tools/test_app_store_builds.py
      - name: Validate release inputs and credentials
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PRODUCTION_BUILD: ${{ inputs.production_build }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'release_version must use major.minor.patch format, such as 1.0.0.' >&2
            exit 1
          }
          [[ "$PRODUCTION_BUILD" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]] || {
            echo 'production_build must contain one to three period-separated integers, such as 1 or 1.0.1.' >&2
            exit 1
          }
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64 ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          test "$major" -ge 26 || { echo 'App Store Connect requires Xcode 26 or newer.'; exit 1; }
      - name: Validate TestFlight and production build numbers
        id: build_number
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.ankit.dailymint.prototype
          TESTED_BUILD_NUMBER: ${{ inputs.tested_build }}
          PRODUCTION_BUILD_NUMBER: ${{ inputs.production_build }}
        run: |
          number=$(python3 ../release-tools/native/tools/validate_app_store_builds.py)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Validated production build number $number"
      - run: chmod +x gradlew ../release-tools/native/tools/upload-testflight.sh
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - name: Verify tested source on the release toolchain
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.number }}
        run: |
          if [ "$(uname -m)" = arm64 ]; then ./gradlew :shared:iosSimulatorArm64Test; else ./gradlew :shared:iosX64Test; fi
          xcodebuild build -project iosApp/FendYourSpend.xcodeproj -scheme FendYourSpend \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Sign and upload App Store candidate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_MARKETING_VERSION: ${{ inputs.release_version }}
          IOS_BUILD_NUMBER: ${{ steps.build_number.outputs.number }}
        run: bash ../release-tools/native/tools/upload-testflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-app-store-candidate
          retention-days: 7
          path: |
            native/iosApp/build/export/*.ipa
