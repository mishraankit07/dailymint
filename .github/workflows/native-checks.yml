name: Native prototype checks
on:
  push:
    paths: ["native/**", ".github/workflows/native-checks.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native-checks.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :shared:jvmTest :shared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: native
          script: ./gradlew :androidApp:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            native/**/build/reports/
            native/androidApp/build/outputs/apk/
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Shared tests on iOS runtime
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            ./gradlew :shared:iosSimulatorArm64Test
          else
            ./gradlew :shared:iosX64Test
          fi
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - name: SwiftUI interaction tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'j=JSON.parse(STDIN.read); d=j["devices"].values.flatten.find{|x| x["name"].start_with?("iPhone")}; abort("No iPhone simulator") unless d; puts d["udid"]')
          xcodebuild test -project iosApp/DailyMintNative.xcodeproj -scheme DailyMintNative -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath iosApp/TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            native/iosApp/TestResults.xcresult
            native/shared/build/reports/
